name: Release

# Push a tag like v2.7 (must match version= in module.prop) to publish a release with the flashable zip.
# "Run workflow" (manual) builds the zip and attaches it to the run as an artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read module.prop
        id: prop
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' module.prop | tr -d '\r' | head -n1)
          code=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r' | head -n1)
          [ -n "$version" ] && [ -n "$code" ] || { echo "module.prop needs version= and versionCode="; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Tag must match module.prop
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.prop.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != module.prop version ${{ steps.prop.outputs.version }}"
            exit 1
          fi

      - name: Build zip (LF-normalised by pack.py)
        run: |
          python pack.py
          ls -l *.zip
          python - <<'PY'
          import glob, zipfile
          z = glob.glob('*.zip')
          assert len(z) == 1, z
          with zipfile.ZipFile(z[0]) as f:
              names = f.namelist()
              assert 'module.prop' in names and 'customize.sh' in names, names
              assert not any(n.startswith('.git') or n == 'pack.py' for n in names), names
              for n in names:
                  assert b'\r' not in f.read(n), 'CR in ' + n
          print('zip ok:', z[0])
          PY

      - name: Release notes from README
        run: |
          # the "## Changes in <version>" section, up to the next "## "
          v="${{ steps.prop.outputs.version }}"
          awk -v h="## Changes in $v" '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' README.md > notes.md
          [ -s notes.md ] || echo "Mount Ubuntu Data $v" > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: '*.zip'
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          zip=$(ls *.zip)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$zip" \
              --title "Mount Ubuntu Data ${GITHUB_REF_NAME}" --notes-file notes.md
          fi

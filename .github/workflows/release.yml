name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read module.prop
        id: prop
        run: |
          set -eu
          version=$(sed -n 's/^version=//p' module.prop | tr -d '\r' | head -n1)
          code=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r' | head -n1)
          [ -n "$version" ] && [ -n "$code" ] || { echo "module.prop needs version= and versionCode="; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build zip (pack.py)
        run: |
          python pack.py
          ls -l *.zip

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.prop.outputs.version }}"
          zip=$(ls *.zip | head -n 1)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "Mount Ubuntu Data $tag" \
              --generate-notes
          fi
